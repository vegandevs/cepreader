# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macOS-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - name: Diagnose macOS SDK and Fortran toolchain
        if: runner.os == 'macOS'
        continue-on-error: true
        shell: bash
        run: |
          echo "::group::Developer tools and SDK"
          xcode-select -p
          xcrun --find ld
          xcrun --sdk macosx --show-sdk-path
          ls -ld /opt/gfortran/SDK
          readlink /opt/gfortran/SDK || true
          echo "::endgroup::"
          echo "::group::Compiler and linker configuration"
          /opt/gfortran/bin/gfortran -v
          /opt/gfortran/bin/gfortran -print-prog-name=ld
          command -v ld
          xcrun ld -version_details || true
          /usr/bin/ld -version_details || true
          R CMD config FC
          R CMD config FFLAGS
          R CMD config LDFLAGS
          echo "::endgroup::"
          echo "::group::Fortran compile and link command plan"
          /opt/gfortran/bin/gfortran -### -arch arm64 src/cepin.f -o "$RUNNER_TEMP/cepread-diagnostic"
          echo "::endgroup::"

      - uses: r-lib/actions/setup-tinytex@v2
      - run: tlmgr --version
      - run: tlmgr update --self

      - name: Install additional LaTeX packages
        env:
          TEXLIVE_PREFER_OWN: "1"
        run: |
          tlmgr install ae babel-english pdflscape pdfpages sidecap
          tlmgr list --only-installed
      
      - name: Install ghostscript
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get -y install ghostscript

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
